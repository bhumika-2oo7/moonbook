<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moonbook</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌓</text></svg>">
<style>
  :root {
    --paper: #e8e6df;
    --ink: #1f2a3a;
    --shade: #3b4a5e;
    --lit: #f6f3e8;
    --line: #c9c6bb;
    --accent: #b5483a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem 4rem;
    background: var(--paper); color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    line-height: 1.5;
  }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 2.4rem; font-weight: 400; letter-spacing: .02em; margin: 0; }
  .sub { margin: .25rem 0 1.5rem; color: var(--shade); }
  .bar { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .bar h2 { flex: 1; margin: 0; font-size: 1.4rem; font-weight: 400; min-width: 9rem; }
  button, label.tog {
    font: inherit; color: var(--ink); background: none;
    border: 1px solid var(--ink); border-radius: 999px;
    padding: .25rem .9rem; cursor: pointer;
  }
  button:hover { background: var(--ink); color: var(--paper); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .dow { text-align: center; color: var(--shade); font-size: .85rem; padding-bottom: .25rem; }
  .day {
    aspect-ratio: 1 / 1.1; border: 1px solid var(--line); border-radius: 6px;
    background: transparent; padding: 4px; display: flex; flex-direction: column;
    align-items: center; justify-content: space-between; cursor: pointer; color: var(--ink);
  }
  .day:hover { background: #dedcd2; color: var(--ink); }
  .day.empty { border: none; cursor: default; pointer-events: none; }
  .day.today { border-color: var(--accent); border-width: 2px; }
  .day.sel { background: var(--ink); color: var(--paper); }
  .day.sel:hover { background: var(--ink); color: var(--paper); }
  .day .n { font-size: .8rem; align-self: flex-start; line-height: 1; }
  .day svg { width: 70%; max-width: 44px; height: auto; }
  .day .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); visibility: hidden; }
  .day .dot.on { visibility: visible; }
  .south .day svg, .south .big svg { transform: scaleX(-1); }
  .detail {
    margin-top: 1.5rem; padding: 1.25rem; border-top: 2px solid var(--ink);
    display: flex; gap: 1.25rem; flex-wrap: wrap;
  }
  .big svg { width: 110px; height: 110px; }
  .info { flex: 1; min-width: 220px; }
  .info h3 { margin: 0; font-size: 1.5rem; font-weight: 400; }
  .info p { margin: .2rem 0 .75rem; color: var(--shade); }
  textarea {
    width: 100%; min-height: 4.5rem; font: inherit; color: var(--ink);
    background: #f1efe8; border: 1px solid var(--line); border-radius: 6px; padding: .5rem;
  }
  .note-hint { font-size: .8rem; color: var(--shade); }
  footer { margin-top: 2rem; font-size: .8rem; color: var(--shade); }
  @media (max-width: 480px) { h1 { font-size: 1.9rem; } .day { padding: 2px; } }
</style>
</head>
<body>
<main id="app">
  <h1>Moonbook</h1>
  <p class="sub">A moon calendar that keeps a one-line journal for each night.</p>

  <div class="bar">
    <button id="prev" aria-label="Previous month">Back</button>
    <h2 id="title" aria-live="polite"></h2>
    <button id="today">Today</button>
    <button id="next" aria-label="Next month">Next</button>
    <label class="tog"><input type="checkbox" id="south"> Southern sky</label>
  </div>

  <div class="grid" id="grid"></div>

  <section class="detail" aria-live="polite">
    <div class="big" id="big"></div>
    <div class="info">
      <h3 id="dName"></h3>
      <p id="dMeta"></p>
      <label for="note">Your note for this night</label>
      <textarea id="note" placeholder="Clear sky? Owl outside? Write one line."></textarea>
      <div class="note-hint">Notes are saved in this browser only.</div>
    </div>
  </section>

  <footer>Phases are calculated in your browser with a mean synodic month of 29.53 days, so they can be off by up to about half a day.</footer>
</main>

<script>
const SYN = 29.530588853;
const REF = Date.UTC(2000, 0, 6, 18, 14); 

const NAMES = ["New moon","Waxing crescent","First quarter","Waxing gibbous",
               "Full moon","Waning gibbous","Last quarter","Waning crescent"];

function moonAt(date) {
  // use noon of the given day
  const t = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate(), 12);
  let age = ((t - REF) / 86400000) % SYN;
  if (age < 0) age += SYN;
  const p = age / SYN;
  const illum = (1 - Math.cos(2 * Math.PI * p)) / 2;
  const name = NAMES[Math.floor(((p * 8) + 0.5)) % 8];
  return { age, p, illum, name };
}

function moonSVG(p, r = 40) {
  const cx = 50, cy = 50, c = Math.cos(2 * Math.PI * p);
  const rx = Math.abs(c) * r;
  const waxing = p < 0.5;
  const first = waxing ? 1 : 0;
  const second = waxing ? (c > 0 ? 0 : 1) : (c > 0 ? 1 : 0);
  const lit = `M ${cx} ${cy - r} A ${r} ${r} 0 0 ${first} ${cx} ${cy + r} A ${rx} ${r} 0 0 ${second} ${cx} ${cy - r} Z`;
  return `<svg viewBox="0 0 100 100" role="img" aria-hidden="true">
    <circle cx="50" cy="50" r="${r}" fill="var(--shade)"/>
    <path d="${lit}" fill="var(--lit)"/>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".5"/>
  </svg>`;
}

const $ = id => document.getElementById(id);
const key = d => `moonbook:${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} }
};

const now = new Date();
let view = new Date(now.getFullYear(), now.getMonth(), 1);
let selected = new Date(now.getFullYear(), now.getMonth(), now.getDate());

function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function renderGrid() {
  $("title").textContent = view.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const grid = $("grid");
  grid.innerHTML = "";
  ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(d => {
    const e = document.createElement("div"); e.className = "dow"; e.textContent = d; grid.appendChild(e);
  });
  const first = new Date(view.getFullYear(), view.getMonth(), 1);
  const lead = (first.getDay() + 6) % 7;
  for (let i = 0; i < lead; i++) {
    const e = document.createElement("div"); e.className = "day empty"; grid.appendChild(e);
  }
  const days = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
  for (let n = 1; n <= days; n++) {
    const d = new Date(view.getFullYear(), view.getMonth(), n);
    const m = moonAt(d);
    const b = document.createElement("button");
    b.className = "day" + (sameDay(d, now) ? " today" : "") + (sameDay(d, selected) ? " sel" : "");
    b.setAttribute("aria-label", `${d.toDateString()}, ${m.name}, ${Math.round(m.illum * 100)}% lit`);
    b.innerHTML = `<span class="n">${n}</span>${moonSVG(m.p)}<span class="dot ${store.get(key(d)) ? "on" : ""}"></span>`;
    b.onclick = () => { selected = d; renderGrid(); renderDetail(); };
    grid.appendChild(b);
  }
}

function renderDetail() {
  const m = moonAt(selected);
  $("big").innerHTML = moonSVG(m.p);
  $("dName").textContent = m.name;
  $("dMeta").textContent =
    `${selected.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" })} · ` +
    `${Math.round(m.illum * 100)}% lit · day ${Math.floor(m.age) + 1} of the cycle`;
  $("note").value = store.get(key(selected));
}

$("note").addEventListener("input", e => {
  store.set(key(selected), e.target.value.trim());
  const dots = document.querySelectorAll(".day:not(.empty)");
  const idx = selected.getDate() - (selected.getMonth() === view.getMonth() ? 1 : 0);
  if (dots[idx]) dots[idx].querySelector(".dot").classList.toggle("on", !!e.target.value.trim());
});
$("prev").onclick = () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); renderGrid(); };
$("next").onclick = () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); renderGrid(); };
$("today").onclick = () => {
  view = new Date(now.getFullYear(), now.getMonth(), 1);
  selected = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  renderGrid(); renderDetail();
};
$("south").onchange = e => $("app").classList.toggle("south", e.target.checked);

renderGrid();
renderDetail();
</script>
</body>
</html>
